type Link {
  id: Int!
  isInternal: Boolean!
  label: String!
  type: LinkType!
  url: String!
}

type LinkType {
  id: Int!
  name: String!
}

type ProjectImage {
  id: Int!
  imageUrl: String!
}

type Product {
  id: Int!
  name: String!
}

type Category {
  id: Int!
  name: String!
}

type PortfolioItem {
  categories: [Category!]!
  description: String!
  githubLinks: [Link!]
  links: [Link!]!
  homeImage: ProjectImage!
  id: Int!
  projectImages: [ProjectImage!]!
  name: String!
  primaryImage: ProjectImage!
  productLinks: [Link!]
  products: [Product!]!
  projectId: String!
}

type CreatePortfolioItemResponse {
  code: Int!
  success: Boolean!
  message: String!
  portfolioItem: PortfolioItem
}

type MarketObservation {
  date: String!
  value: Float!
}

type MarketSeries {
  fredId: String!
  label: String!
  category: String!
  unit: String!
  lastFetchedAt: String
  """Observations for the series, narrowed by the `from`/`to` query arguments."""
  observations: [MarketObservation!]!
  """
  The most recent observation for the series overall. Unaffected by `from`/`to`,
  so a windowed chart query still reports the current value.
  """
  latest: MarketObservation
  """The observation before `latest`, for computing the change. Unaffected by `from`/`to`."""
  previous: MarketObservation
}

type YieldCurvePoint {
  fredId: String!
  label: String!
  months: Int!
  value: Float
}

type YieldCurveComparison {
  key: String!
  label: String!
  date: String!
  points: [YieldCurvePoint!]!
}

type YieldCurve {
  date: String!
  points: [YieldCurvePoint!]!
  comparisons: [YieldCurveComparison!]!
}

type Query {
  links: [Link!]!
  projectImages: [ProjectImage!]!
  categories: [Category!]!
  products: [Product!]!
  linkTypes: [LinkType!]!
  portfolioItems: [PortfolioItem!]!
  marketSeries(ids: [String!], category: String, from: String, to: String): [MarketSeries!]!
  yieldCurve(date: String): YieldCurve!
}

type Mutation {
  createPortfolioItem(
    categories: [Int!]!
    description: String!
    links: [Int!]!
    homeImage: Int!
    projectImages: [Int!]!
    name: String!
    primaryImage: Int!
    products: [Int!]!
    projectId: String!
  ): CreatePortfolioItemResponse
}