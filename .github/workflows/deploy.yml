name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC: assume the deploy role, no stored AWS keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Inert until the Terraform module has actually been applied and the two
    # repo variables are set from its outputs. Without this the job fails on
    # every push, because there is no role to assume and no instance to target.
    # Setting the variables activates it — no workflow change needed.
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The instance pulls and builds; CI only triggers it and reports the
      # result. The role's only permission is SendCommand against this box.
      - name: Run deploy on the instance
        run: |
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=instanceids,Values=${{ vars.AWS_INSTANCE_ID }}" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters 'commands=["sudo -u ec2-user -H /usr/local/bin/portfolio-api-deploy"]' \
            --query Command.CommandId --output text)

          echo "SSM command: $command_id"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output text

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query Status --output text)
          [ "$status" = "Success" ] || exit 1
