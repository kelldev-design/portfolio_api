schema: ./src/graphql/**/*.graphql
generates:
  ./src/types/generatedTypes.ts:
    config:
      useIndexSignature: true
      contextType: ../graphql/context#Context
      mappers:
        MarketSeries: ../services/marketData#MarketSeriesResult
    plugins:
      - typescript
      - typescript-resolvers
hooks:
  afterOneFileWrite:
    - eslint --fix